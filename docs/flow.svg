<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">How it works: five steps, one branch</title>
  <desc id="d">A recording goes up. It is detected by structure, not title. It is held until actually finished. One prepared email arrives. You check it and publish. If the expected item never appeared, you get told.</desc>

  <style>
    .f  { font-family: "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif; }
    .num     { font-size: 12px; font-weight: 700; letter-spacing: .18em; fill: #66737A; }
    .label   { font-size: 17.5px; font-weight: 600; fill: #1F2A2E; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .22em; fill: #66737A; }
    .cap     { font-size: 13px; font-weight: 500; fill: #66737A; }
    .pill    { font-size: 16px; font-weight: 700; fill: #F9FBFB; }
    .leg     { font-size: 13.5px; font-weight: 500; fill: #66737A; }
  </style>

  <rect x="0" y="0" width="1280" height="400" rx="18" fill="#F9FBFB"/>
  <rect x=".75" y=".75" width="1278.5" height="398.5" rx="17.25" fill="none" stroke="#E6EDEE" stroke-width="1.5"/>

  <!-- Automating Min custom wordmark (Brand System 2026-08/wordmark/wordmark-1line.svg),
       scaled to 20px cap height. The two T crossbars are the brand device, so no separate bars. -->
  <g transform="translate(1001.6,38) scale(0.1)"><g transform="translate(0,0)"><clipPath id="aclip0"><path d="M 63,0 L 109,0 L 172,200 L 0,200 Z"/></clipPath><path d="M 63,0 L 109,0 L 172,200 L 126,200 L 86,74 L 46,200 L 0,200 Z" fill="#1F2A2E"/><g clip-path="url(#aclip0)"><path d="M -2,104 L 238,104 L 210,144 L -30,144 Z" fill="#1F2A2E"/></g></g><g transform="translate(184,0)"><path d="M 0,0 L 46,0 L 46,126 C 46,167 122,167 122,126 L 122,0 L 168,0 L 168,128
                 C 168,228 0,228 0,128 Z" fill="#1F2A2E"/></g><g transform="translate(364,0)"><path d="M 71,46 L 117,46 L 117,200 L 71,200 Z" fill="#1F2A2E"/><path d="M 32.199999999999996,0 L 188.2,0 L 156,46 L 0,46 Z" fill="#4A9BAA"/></g><g transform="translate(564,0)"><path fill-rule="evenodd" d="M 93,-3 C 145,-3 186,43 186,100 C 186,157 145,203 93,203
                 C 41,203 0,157 0,100 C 0,43 41,-3 93,-3 Z
                 M 93,45 C 68,45 48,70 48,100 C 48,130 68,155 93,155
                 C 118,155 138,130 138,100 C 138,70 118,45 93,45 Z" fill="#1F2A2E"/></g><g transform="translate(762,0)"><path d="M 0,200 L 0,0 L 54,0 L 108,112 L 162,0 L 216,0 L 216,200 L 172,200 L 172,86
                 L 128,180 L 88,180 L 44,86 L 44,200 Z" fill="#1F2A2E"/></g><g transform="translate(990,0)"><clipPath id="aclip1"><path d="M 63,0 L 109,0 L 172,200 L 0,200 Z"/></clipPath><path d="M 63,0 L 109,0 L 172,200 L 126,200 L 86,74 L 46,200 L 0,200 Z" fill="#1F2A2E"/><g clip-path="url(#aclip1)"><path d="M -2,104 L 238,104 L 210,144 L -30,144 Z" fill="#1F2A2E"/></g></g><g transform="translate(1174,0)"><path d="M 71,46 L 117,46 L 117,200 L 71,200 Z" fill="#1F2A2E"/><path d="M 32.199999999999996,0 L 188.2,0 L 156,46 L 0,46 Z" fill="#D9B45C"/></g><g transform="translate(1374,0)"><path d="M 0,0 L 46,0 L 46,200 L 0,200 Z" fill="#1F2A2E"/></g><g transform="translate(1432,0)"><path d="M 0,200 L 0,0 L 52,0 L 144,132 L 144,0 L 190,0 L 190,200 L 138,200
                 L 46,68 L 46,200 Z" fill="#1F2A2E"/></g><g transform="translate(1634,0)"><path d="M 97,-3 C 148,-3 183,27 190,72 L 142,72 C 135,54 118,45 97,45
                 C 71,45 48,70 48,100 C 48,130 71,155 97,155 C 120,155 138,143 143,124
                 L 97,124 L 97,84 L 190,84 L 190,200 L 152,200 L 152,172
                 C 138,192 118,203 95,203 C 41,203 0,157 0,100 C 0,43 43,-3 97,-3 Z" fill="#1F2A2E"/></g><g transform="translate(1908,0)"><path d="M 0,200 L 0,0 L 54,0 L 108,112 L 162,0 L 216,0 L 216,200 L 172,200 L 172,86
                 L 128,180 L 88,180 L 44,86 L 44,200 Z" fill="#1F2A2E"/></g><g transform="translate(2136,0)"><path d="M 0,0 L 46,0 L 46,200 L 0,200 Z" fill="#1F2A2E"/></g><g transform="translate(2194,0)"><path d="M 0,200 L 0,0 L 52,0 L 144,132 L 144,0 L 190,0 L 190,200 L 138,200
                 L 46,68 L 46,200 Z" fill="#1F2A2E"/></g></g>

  <text class="f eyebrow" x="120" y="52">HOW IT WORKS</text>


  <!-- the track: teal while the machine carries it, butter once it is yours -->
  <polygon points="125.6,196 905.6,196 900,204 120,204" fill="#4A9BAA"/>
  <polygon points="905.6,196 1165.6,196 1160,204 900,204" fill="#D9B45C"/>

  <!-- 01 upstream -->
  <text class="f num"   x="120" y="118" text-anchor="middle">01</text>
  <text class="f label" x="120" y="150" text-anchor="middle">A recording</text>
  <text class="f label" x="120" y="172" text-anchor="middle">goes up</text>
  <circle cx="120" cy="200" r="15" fill="#F9FBFB" stroke="#66737A" stroke-width="3"/>
  <circle cx="120" cy="200" r="6" fill="#66737A"/>

  <!-- 02 -->
  <text class="f num"   x="380" y="118" text-anchor="middle">02</text>
  <text class="f label" x="380" y="150" text-anchor="middle">Detected by</text>
  <text class="f label" x="380" y="172" text-anchor="middle">structure, not title</text>
  <circle cx="380" cy="200" r="15" fill="#F9FBFB" stroke="#4A9BAA" stroke-width="3"/>
  <circle cx="380" cy="200" r="6" fill="#4A9BAA"/>

  <!-- 03 -->
  <text class="f num"   x="640" y="118" text-anchor="middle">03</text>
  <text class="f label" x="640" y="150" text-anchor="middle">Held until it is</text>
  <text class="f label" x="640" y="172" text-anchor="middle">actually finished</text>
  <circle cx="640" cy="200" r="15" fill="#F9FBFB" stroke="#4A9BAA" stroke-width="3"/>
  <circle cx="640" cy="200" r="6" fill="#4A9BAA"/>

  <!-- 04 -->
  <text class="f num"   x="900" y="118" text-anchor="middle">04</text>
  <text class="f label" x="900" y="150" text-anchor="middle">One email,</text>
  <text class="f label" x="900" y="172" text-anchor="middle">everything prepared</text>
  <circle cx="900" cy="200" r="15" fill="#F9FBFB" stroke="#4A9BAA" stroke-width="3"/>
  <circle cx="900" cy="200" r="6" fill="#4A9BAA"/>

  <!-- 05 you -->
  <text class="f num"   x="1160" y="118" text-anchor="middle">05</text>
  <text class="f label" x="1160" y="150" text-anchor="middle">You check it</text>
  <text class="f label" x="1160" y="172" text-anchor="middle">and publish</text>
  <circle cx="1160" cy="200" r="17" fill="#F5E9CC" stroke="#D9B45C" stroke-width="3.5"/>
  <circle cx="1160" cy="200" r="6.5" fill="#D9B45C"/>

  <!-- the branch nobody builds: report the absence -->
  <path d="M380 221 L380 300" fill="none" stroke="#66737A" stroke-width="1.6" stroke-dasharray="3 6" stroke-linecap="round"/>
  <text class="f cap" x="398" y="250">when the expected item</text>
  <text class="f cap" x="398" y="268">never appeared</text>
  <rect x="250" y="300" width="260" height="48" rx="24" fill="#1F2A2E"/>
  <polygon points="276,318 300,318 293,330 269,330" fill="#6FC0CF"/>
  <text class="f pill" x="390" y="330" text-anchor="middle">You get told</text>

  <!-- legend, set against the pill to balance the lower half -->
  <rect x="640" y="312" width="16" height="16" rx="4" fill="#F9FBFB" stroke="#4A9BAA" stroke-width="2.5"/>
  <text class="f leg" x="666" y="325">Automated</text>

  <rect x="776" y="312" width="16" height="16" rx="4" fill="#F5E9CC" stroke="#D9B45C" stroke-width="2.5"/>
  <text class="f leg" x="802" y="325">You, the one step that stays yours</text>

  <rect x="1060" y="312" width="16" height="16" rx="4" fill="#1F2A2E" stroke="#6FC0CF" stroke-width="2"/>
  <text class="f leg" x="1086" y="325">Alert</text>

</svg>
